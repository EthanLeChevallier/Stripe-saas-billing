<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atelier Cloud | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f3ea;
        --ink: #1b2f2a;
        --panel: rgba(255,255,255,0.75);
        --line: rgba(27,47,42,0.12);
        --green: #176b56;
        --green-soft: #dfeee7;
        --coral: #ef7858;
        --purple: #7b6de1;
      }
      body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
      .panel { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); }
      .sparkline { background: linear-gradient(180deg, rgba(123,109,225,.18), rgba(123,109,225,.03)); }
    </style>
  </head>
  <body class="min-h-screen">
    <div class="mx-auto max-w-7xl px-6 py-8">
      <header class="mb-8 flex items-center justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.22em] text-emerald-800">Operations</p>
          <h1 class="mt-2 text-3xl font-extrabold text-slate-900">Dashboard SaaS</h1>
        </div>
        <a href="/" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium shadow-sm hover:border-slate-300">Retour à l’accueil</a>
      </header>

      <section class="mb-8 grid gap-4 md:grid-cols-4">
        <article class="panel rounded-2xl p-5 shadow-sm">
          <p class="text-sm text-slate-500">Revenu mensuel</p>
          <p id="monthlyRevenue" class="mt-4 text-3xl font-bold">€0</p>
        </article>
        <article class="panel rounded-2xl p-5 shadow-sm">
          <p class="text-sm text-slate-500">Abonnés actifs</p>
          <p id="activeSubscriptions" class="mt-4 text-3xl font-bold">0</p>
        </article>
        <article class="panel rounded-2xl p-5 shadow-sm">
          <p class="text-sm text-slate-500">Taux de churn</p>
          <p id="churn" class="mt-4 text-3xl font-bold">0%</p>
        </article>
        <article class="panel rounded-2xl p-5 shadow-sm">
          <p class="text-sm text-slate-500">Conversion</p>
          <p id="conversionRate" class="mt-4 text-3xl font-bold">0%</p>
        </article>
      </section>

      <section class="grid gap-6 lg:grid-cols-[1.5fr_0.8fr]">
        <article class="panel rounded-2xl p-5 shadow-sm">
          <div class="mb-5 flex items-center justify-between">
            <h2 class="text-xl font-bold">Paiements récents</h2>
            <span class="rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-semibold text-emerald-900">Live</span>
          </div>
          <div class="overflow-hidden rounded-xl border border-slate-200">
            <table class="min-w-full text-left text-sm">
              <thead class="bg-slate-100">
                <tr>
                  <th class="px-4 py-3 font-semibold">Client</th>
                  <th class="px-4 py-3 font-semibold">Plan</th>
                  <th class="px-4 py-3 font-semibold">Montant</th>
                  <th class="px-4 py-3 font-semibold">Statut</th>
                </tr>
              </thead>
              <tbody id="paymentsTable" class="bg-white/40"></tbody>
            </table>
          </div>
        </article>

        <aside class="panel rounded-2xl p-5 shadow-sm">
          <h2 class="mb-4 text-xl font-bold">Alertes</h2>
          <ul id="alertsList" class="space-y-3"></ul>
        </aside>
      </section>
    </div>

    <script>
      async function loadDashboard() {
        const response = await fetch('/api/v1/dashboard');
        const data = await response.json();

        document.getElementById('monthlyRevenue').textContent = `€${(data.summary.monthlyRevenue / 100).toFixed(2)}`;
        document.getElementById('activeSubscriptions').textContent = String(data.summary.activeSubscriptions);
        document.getElementById('churn').textContent = `${data.summary.churn.toFixed(1)}%`;
        document.getElementById('conversionRate').textContent = `${data.summary.conversionRate.toFixed(1)}%`;

        const table = document.getElementById('paymentsTable');
        table.innerHTML = data.recentPayments.map((payment) => `
          <tr class="border-t border-slate-200">
            <td class="px-4 py-3">${payment.customer}</td>
            <td class="px-4 py-3">${payment.plan}</td>
            <td class="px-4 py-3">€${(payment.amount / 100).toFixed(2)}</td>
            <td class="px-4 py-3">
              <span class="inline-flex rounded-full px-2 py-1 text-xs font-semibold ${payment.status === 'paid' ? 'bg-emerald-100 text-emerald-900' : 'bg-amber-100 text-amber-900'}">${payment.status === 'paid' ? 'Payé' : 'En attente'}</span>
            </td>
          </tr>
        `).join('');

        const alerts = document.getElementById('alertsList');
        alerts.innerHTML = data.alerts.map((alert) => `
          <li class="rounded-xl border border-slate-200 bg-white/60 px-3 py-2 text-sm text-slate-700">• ${alert}</li>
        `).join('');
      }

      loadDashboard();
    </script>
  </body>
</html>
